services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jmi
      POSTGRES_PASSWORD: jmi_dev_password
      POSTGRES_DB: jmi_trading
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmi"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://jmi:jmi_dev_password@postgres:5432/jmi_trading
      JWT_SECRET: dev-only-secret-change-me
      CORS_ORIGINS: '["*"]'
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]

volumes:
  pgdata:
